<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>데굴 — 중앙대를 굴려서 뭉쳐 봐</title>
<meta name="description" content="주먹만 한 공을 중앙대학교 서울캠퍼스에서 굴려, 벤치부터 본관까지 붙이며 키우는 3D 웹게임">
<meta name="theme-color" content="#16141a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root { --bg: #16141a; --panel: #232028; --line: #3a3640; --ink: #f4efe6; --mute: #a59f95; --acc: #ffa620; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; }
.big { font-family: "Black Han Sans", sans-serif; font-weight: 400; letter-spacing: 0.01em; }
[hidden] { display: none !important; }

#hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 12px) 16px 0; pointer-events: none; }
#hud .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
#dia { font-size: 40px; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
#dia small { font-size: 20px; margin-left: 2px; }
#grade { margin-top: 6px; font-size: 15px; font-weight: 700; color: var(--acc); text-shadow: 0 1px 0 rgba(0,0,0,.5); }
#next { margin-top: 2px; font-size: 12px; color: var(--ink); opacity: .85; text-shadow: 0 1px 0 rgba(0,0,0,.6); }
#side { text-align: right; font-size: 14px; font-weight: 700; text-shadow: 0 1px 0 rgba(0,0,0,.6); line-height: 1.5; }
#ebox { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
#ebox span { font-size: 12px; font-weight: 700; text-shadow: 0 1px 0 rgba(0,0,0,.6); }
#ebar { flex: 1; height: 8px; background: rgba(22,20,26,.55); border-radius: 4px; overflow: hidden; }
#ebar i { display: block; height: 100%; width: 100%; background: var(--acc); border-radius: 4px; transform-origin: left; }
#ebar.low i { background: #e5484d; }

#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 150px); transform: translateX(-50%); pointer-events: none;
  background: rgba(22,20,26,.82); padding: 8px 14px; border-radius: 6px; font-size: 14px; font-weight: 700; white-space: nowrap;
  opacity: 0; transition: opacity .2s; }
#toast.on { opacity: 1; }
#gradeup { position: fixed; left: 0; right: 0; top: 38%; text-align: center; pointer-events: none; font-size: 54px; color: var(--acc);
  text-shadow: 0 4px 0 rgba(0,0,0,.4); opacity: 0; transform: scale(.8); transition: opacity .25s, transform .25s; }
#gradeup.on { opacity: 1; transform: scale(1); }
#gradeup small { display: block; font-family: -apple-system, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink); margin-top: 6px; }

#joy { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 2px solid rgba(244,239,230,.45);
  pointer-events: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(244,239,230,.55); }

.layer { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(16,14,20,.72); z-index: 10; }
.panel { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px 18px; box-sizing: border-box; }
.btn { display: block; width: 100%; border: 0; border-radius: 8px; padding: 15px 0; font-size: 17px; font-weight: 800; cursor: pointer;
  background: var(--acc); color: #1b1408; font-family: inherit; }
.btn.sub { background: transparent; color: var(--ink); border: 1px solid var(--line); margin-top: 10px; font-weight: 700; }
#start h1 { margin: 0; font-size: 64px; line-height: 1; color: var(--acc); text-align: center; }
#start .tag { text-align: center; margin: 10px 0 18px; font-size: 16px; font-weight: 700; }
#start ul { margin: 0 0 20px; padding: 0 0 0 18px; color: var(--mute); font-size: 14px; line-height: 1.65; }
#start .best { text-align: center; color: var(--mute); font-size: 13px; margin-top: 12px; }

#cards h2 { margin: 0 0 4px; font-size: 22px; text-align: center; }
#cards p.h { margin: 0 0 14px; text-align: center; color: var(--mute); font-size: 13px; }
.card { display: block; width: 100%; text-align: left; background: #2c2832; border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-top: 10px;
  color: var(--ink); font-family: inherit; cursor: pointer; }
.card b { font-size: 17px; }
.card .lv { float: right; color: var(--acc); font-size: 13px; letter-spacing: 2px; }
.card div { margin-top: 4px; font-size: 13px; color: var(--mute); line-height: 1.45; }
.card:active { border-color: var(--acc); }

#end h2 { margin: 0; font-size: 26px; text-align: center; color: var(--acc); }
#end .why { text-align: center; color: var(--mute); font-size: 13px; margin: 6px 0 16px; }
#end dl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 16px; }
#end dl div { background: #2c2832; border-radius: 8px; padding: 10px 12px; }
#end dt { font-size: 12px; color: var(--mute); }
#end dd { margin: 2px 0 0; font-size: 20px; }
#end dl div.wide { grid-column: span 2; }
#end .rec { text-align: center; font-size: 13px; color: var(--acc); margin: -6px 0 14px; min-height: 1em; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--mute); font-size: 14px; z-index: 20; background: var(--bg); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">중앙대를 불러오는 중…</div>

<div id="hud" hidden>
  <div class="row">
    <div>
      <div id="dia" class="big">1.00<small>m</small></div>
      <div id="grade">캔급</div>
      <div id="next"></div>
    </div>
    <div id="side"><div id="time">0:00</div><div id="count">0개</div></div>
  </div>
  <div id="ebox"><span>기운</span><div id="ebar"><i></i></div></div>
</div>
<div id="toast"></div>
<div id="gradeup" class="big"></div>
<div id="joy" hidden><i></i></div>

<div id="start" class="layer" hidden>
  <div class="panel">
    <h1 class="big">데굴</h1>
    <div class="tag">중앙대를 굴려서 뭉쳐 봐</div>
    <ul>
      <li>화면을 끌면 그쪽으로 공이 굴러가요.</li>
      <li>공 지름의 절반보다 작은 건 달라붙고, 큰 건 튕겨요.</li>
      <li>건물을 세게 들이받으면 조각이 떨어져요.</li>
      <li>기운이 다 빠지기 전에 계속 붙이세요.</li>
    </ul>
    <button class="btn" id="go">굴리기</button>
    <div class="best" id="best"></div>
  </div>
</div>

<div id="cards" class="layer" hidden>
  <div class="panel">
    <h2>강화 고르기</h2>
    <p class="h">하나만 고를 수 있어요</p>
    <div id="cardlist"></div>
  </div>
</div>

<div id="end" class="layer" hidden>
  <div class="panel">
    <h2 class="big" id="endTitle">기운이 다 빠졌어요</h2>
    <div class="why" id="endWhy"></div>
    <dl>
      <div><dt>지름</dt><dd class="big" id="eDia"></dd></div>
      <div><dt>시간</dt><dd class="big" id="eTime"></dd></div>
      <div><dt>붙인 물건</dt><dd class="big" id="eCount"></dd></div>
      <div><dt>등급</dt><dd class="big" id="eGrade"></dd></div>
      <div class="wide"><dt>가장 큰 것</dt><dd id="eBig"></dd></div>
    </dl>
    <div class="rec" id="eRec"></div>
    <button class="btn" id="again">한 판 더</button>
    <button class="btn sub" id="share">결과 카드 저장</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = (id) => document.getElementById(id);
const QS = new URLSearchParams(location.search);
const COARSE = matchMedia('(pointer: coarse)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
// the world layout comes from a fixed seed, so every run starts on the same map
let seed = 20261103;
const srand = () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);
const srange = (a, b) => a + srand() * (b - a);

// ============ data
let D;
try {
  D = await (await fetch('campus.json')).json();
} catch (err) {
  $('loading').textContent = '지도 데이터를 불러오지 못했어요. 새로고침해 주세요.';
  throw err;
}
// keep only a band of ground around the campus
{
  const t = D.terrain, M = 40;
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  const grow = ([x, z]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); };
  for (const r of D.campus) r.forEach(grow);
  for (const b of D.buildings) b.o.forEach(grow);
  const j0 = Math.max(0, Math.floor((x0 - M - t.x0) / t.step)), j1 = Math.min(t.nx - 1, Math.ceil((x1 + M - t.x0) / t.step));
  const i0 = Math.max(0, Math.floor((z0 - M - t.z0) / t.step)), i1 = Math.min(t.nz - 1, Math.ceil((z1 + M - t.z0) / t.step));
  const nx = j1 - j0 + 1, nz = i1 - i0 + 1, dm = new Array(nx * nz);
  for (let i = 0; i < nz; i++) for (let j = 0; j < nx; j++) dm[i * nx + j] = t.dm[(i + i0) * t.nx + j + j0];
  D.terrain = { ...t, x0: t.x0 + j0 * t.step, z0: t.z0 + i0 * t.step, nx, nz, dm };
}
const T = D.terrain;
const W = (T.nx - 1) * T.step, H = (T.nz - 1) * T.step;
const X1 = T.x0 + W, Z1 = T.z0 + H;
const elev = Float32Array.from(T.dm, (v) => v / 10);
function groundY(x, z) {
  const gj = clamp((x - T.x0) / T.step, 0, T.nx - 1.0001), gi = clamp((z - T.z0) / T.step, 0, T.nz - 1.0001);
  const j = Math.floor(gj), i = Math.floor(gi), fx = gj - j, fz = gi - i, k = i * T.nx + j;
  const a = elev[k], b = elev[k + 1], c = elev[k + T.nx], d = elev[k + T.nx + 1];
  return fx + fz <= 1 ? a + (b - a) * fx + (c - a) * fz : d + (c - d) * (1 - fx) + (b - d) * (1 - fz);
}
const CAMPUS = D.campus[0];
const CB = (() => {
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const [x, z] of CAMPUS) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); }
  return { cx: (x0 + x1) / 2, cz: (z0 + z1) / 2, x0, x1, z0, z1 };
})();

function inPoly(x, z, p) {
  let c = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const xi = p[i][0], zi = p[i][1], xj = p[j][0], zj = p[j][1];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) c = !c;
  }
  return c;
}
function closestOnPoly(x, z, p) {
  let best = Infinity, bx = 0, bz = 0;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const ax = p[j][0], az = p[j][1], dx = p[i][0] - ax, dz = p[i][1] - az;
    const t = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz || 1e-9), 0, 1);
    const qx = ax + t * dx, qz = az + t * dz, d = (x - qx) ** 2 + (z - qz) ** 2;
    if (d < best) { best = d; bx = qx; bz = qz; }
  }
  return [bx, bz, Math.sqrt(best)];
}

// ============ renderer, scene
const stage = $('stage');
const PR_MAX = Math.min(devicePixelRatio || 1, COARSE ? 1.5 : 2), PR_MIN = COARSE ? 0.75 : 1;
let pixelRatio = PR_MAX;
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: !(COARSE && devicePixelRatio >= 2), powerPreference: 'high-performance' });
} catch (err) {
  $('loading').textContent = '이 브라우저에서 WebGL을 쓸 수 없어 3D 화면을 그리지 못했어요.';
  throw err;
}
renderer.setPixelRatio(pixelRatio);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const SKY = new THREE.Color('#a9c6dd');
scene.background = SKY.clone();
scene.fog = new THREE.Fog(SKY.clone(), 80, 500);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 4000);
scene.add(new THREE.HemisphereLight(0xeef3f8, 0x6d6655, 2.1));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.0);
sun.position.set(0.55, 1, 0.3);
scene.add(sun);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w < h ? 60 : 50;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ============ buildings
const WALLS = ['#d9d2c5', '#c9bfae', '#bfc4c4', '#d6cdbd', '#b9ae9c', '#e2ddd3', '#cbb9a3'];
const BLD = D.buildings.map((b, i) => {
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity, area = 0;
  b.o.forEach(([x, z], k) => {
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z);
    const [nx, nz] = b.o[(k + 1) % b.o.length];
    area += x * nz - nx * z;
  });
  area = Math.abs(area) / 2;
  return {
    i, name: b.n || '건물', poly: b.o, x0, x1, z0, z1, cx: (x0 + x1) / 2, cz: (z0 + z1) / 2,
    base: b.lo - 2, top: b.g + b.h, h: b.h, area,
    s: 0.4 * (Math.sqrt(area) + b.h), vol: area * b.h * 0.2,
    wall: WALLS[i % WALLS.length], roof: b.rc || '#cfcabd', alive: true, hitCd: 0, mesh: null,
  };
});
const bldMat = new THREE.MeshLambertMaterial({ vertexColors: true });
bldMat.onBeforeCompile = (sh) => {
  // windows drawn in the building's own coordinates, so they stay put when the building rolls with the ball
  sh.vertexShader = 'varying vec3 vLP;\nvarying vec3 vLN;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvLP = position; vLN = normal;');
  sh.fragmentShader = 'varying vec3 vLP;\nvarying vec3 vLN;\n' + sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
    if (abs(vLN.y) < 0.5) {
      vec2 tg = normalize(vec2(-vLN.z, vLN.x));
      float fu = fract(dot(vLP.xz, tg) / 3.2);
      float fy = fract((vLP.y - 1.0) / 3.6);
      float win = step(0.22, fu) * step(fu, 0.78) * step(0.34, fy) * step(fy, 0.84) * step(3.4, vLP.y);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.16, 0.22, 0.27), win * 0.85);
    }`);
};
for (const b of BLD) {
  const shape = new THREE.Shape(b.poly.map(([x, z]) => new THREE.Vector2(x - b.cx, -(z - b.cz))));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: b.top - b.base, bevelEnabled: false });
  geo.rotateX(-Math.PI / 2);
  const n = geo.attributes.position.count, col = new Float32Array(n * 3);
  const roof = new THREE.Color(b.roof), wall = new THREE.Color(b.wall);
  for (const g of geo.groups) {
    const c = g.materialIndex === 0 ? roof : wall;
    for (let v = g.start; v < g.start + g.count; v++) col.set([c.r, c.g, c.b], v * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.clearGroups();
  b.mesh = new THREE.Mesh(geo, bldMat);
  b.mesh.position.set(b.cx, b.base, b.cz);
  scene.add(b.mesh);
}
function inBuilding(x, z, pad) {
  for (const b of BLD) {
    if (!b.alive || x < b.x0 - pad || x > b.x1 + pad || z < b.z0 - pad || z > b.z1 + pad) continue;
    if (inPoly(x, z, b.poly) || closestOnPoly(x, z, b.poly)[2] < pad) return b;
  }
  return null;
}

// ============ ground
{
  const PX = Math.min(4, 2048 / Math.max(W, H));
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(W * PX); cv.height = Math.ceil(H * PX);
  const g = cv.getContext('2d');
  const X = (x) => (x - T.x0) * PX, Y = (z) => (z - T.z0) * PX;
  const ring = (r) => { g.beginPath(); r.forEach(([x, z], i) => (i ? g.lineTo(X(x), Y(z)) : g.moveTo(X(x), Y(z)))); g.closePath(); };
  g.fillStyle = '#8e9b7c'; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = '#a3b683'; ring(CAMPUS); g.fill();
  const LC = { wood: '#5f8a4c', park: '#8fbb6a', pitch: '#4f9a5a', water: '#5d9cc4', res: '#b5ad9e' };
  for (const l of D.lands) for (const r of l.r) { g.fillStyle = LC[l.k] || '#9aa983'; ring(r); g.fill(); }
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.fillStyle = g.strokeStyle = '#cdc5b4'; g.lineWidth = 12 * PX;
  for (const b of BLD) { ring(b.poly); g.fill(); g.stroke(); }
  const RW = { tertiary: [13, '#6f6e73'], residential: [9, '#77767b'], service: [6, '#8e8d91'], pedestrian: [5, '#d6ccba'], steps: [3.5, '#c7bca8'], path: [2.5, '#cbbfa8'] };
  for (const pass of [0, 1]) for (const r of D.roads) {
    const [w, c] = RW[r.k] || [3, '#c9bfa9'];
    g.strokeStyle = pass ? c : 'rgba(0,0,0,.12)'; g.lineWidth = (w + (pass ? 0 : 1.5)) * PX;
    g.beginPath(); r.p.forEach(([x, z], i) => (i ? g.lineTo(X(x), Y(z)) : g.moveTo(X(x), Y(z)))); g.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  // the ground mesh uses every other height sample; groundY() still reads the full grid
  const S2 = 2, gx = Math.floor((T.nx - 1) / S2) + 1, gz = Math.floor((T.nz - 1) / S2) + 1;
  const pos = new Float32Array(gx * gz * 3), uv = new Float32Array(gx * gz * 2), idx = [];
  for (let i = 0; i < gz; i++) for (let j = 0; j < gx; j++) {
    const k = i * gx + j, x = T.x0 + j * S2 * T.step, z = T.z0 + i * S2 * T.step;
    pos.set([x, elev[i * S2 * T.nx + j * S2], z], k * 3);
    uv.set([(x - T.x0) / W, 1 - (z - T.z0) / H], k * 2);
    if (i < gz - 1 && j < gx - 1) idx.push(k, k + gx, k + 1, k + 1, k + gx, k + gx + 1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: tex })));
}

// ============ object kinds
function part(geo, color, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  geo.rotateX(rx); geo.rotateY(ry); geo.rotateZ(rz); geo.translate(x, y, z);
  const g = geo.index ? geo.toNonIndexed() : geo;
  const c = new THREE.Color(color), n = g.attributes.position.count, col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) col.set([c.r, c.g, c.b], i * 3);
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.deleteAttribute('uv');
  return g;
}
const Box = (w, h, d) => new THREE.BoxGeometry(w, h, d);

function walk(p, step, fn) {

  for (let i = 1; i < p.length; i++) {
    const [ax, az] = p[i - 1], [bx, bz] = p[i], len = Math.hypot(bx - ax, bz - az);
    if (len < 1e-3) continue;
    const ux = (bx - ax) / len, uz = (bz - az) / len;
    let d = left;
    while (d < len) { fn(ax + ux * d, az + uz * d, ux, uz); d += step * (0.7 + 0.6 * srand()); }
    left = d - len;
  }
}

function showObj(o) {

// ============ spatial grid
const CELL = 6;
const GRID = new Map();
const gkey = (ix, iz) => ix * 65536 + iz;
function gridAdd(o) {
  const k = gkey(Math.floor((o.x - T.x0) / CELL), Math.floor((o.z - T.z0) / CELL));
  let a = GRID.get(k);
  if (!a) GRID.set(k, (a = []));
  a.push(o);
}
function gridEach(x, z, rad, fn) {
  const i0 = Math.floor((x - rad - T.x0) / CELL), i1 = Math.floor((x + rad - T.x0) / CELL);
  const j0 = Math.floor((z - rad - T.z0) / CELL), j1 = Math.floor((z + rad - T.z0) / CELL);
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
    const a = GRID.get(gkey(i, j));
    if (!a) continue;
    for (let n = a.length - 1; n >= 0; n--) {
      const o = a[n];
      if (!o.alive) { a[n] = a[a.length - 1]; a.pop(); continue; }
      fn(o);
    }
  }
}
for (const o of OBJ) { showObj(o); gridAdd(o); }

  // energy
  if (S.t > 3) S.E -= DRAIN * dt;
  // grades and cards
  const dnow = 2 * S.r;
  if (dnow > S.maxD) {
    S.maxD = dnow;
    while (S.grade + 1 < GRADES.length && S.maxD >= GRADES[S.grade + 1].d) {
      S.grade++; gradeUp(GRADES[S.grade].n); sfxLevel(); vib([30, 40, 30]); S.shake = Math.max(S.shake, 0.5);
    }
    while (S.cardIx < CARD_AT.length && S.maxD >= CARD_AT[S.cardIx]) { S.cardIx++; S.pendingCards++; }
  }
  if (S.E <= 0) { S.E = 0; S.mode = 'ending'; S.endT = 0; sfxEnd(); input.active = false; joy.hidden = true; }
  else if (S.pendingCards > 0 && S.mode === 'play') openCards();
}

// ============ ball and camera visuals
const _axis = new THREE.Vector3();
function placeBall(dt) {
  const r = S.r, sp = Math.hypot(S.vx, S.vz);
  if (sp > 1e-4) {
    _axis.set(S.vz, 0, -S.vx).normalize();
    ballSpin.quaternion.premultiply(_qt.setFromAxisAngle(_axis, (sp * dt) / r));
    S.roll += (sp * dt) / r;
  }
  S.lump = Math.max(0, (S.lump || 0) - dt * 0.02);
  const wob = (S.lump || 0) * r * 0.3 * Math.abs(Math.sin(S.roll));
  const gy = groundY(S.x, S.z);
  ballRoot.position.set(S.x, gy + r * 0.9 + wob, S.z);
  core.scale.setScalar(r * 0.88);
  shadow.position.set(S.x, gy + 0.05, S.z);
  shadow.scale.setScalar(r * 2.6);
}
function placeCamera(dt, orbit = 0) {
  const sp = Math.hypot(S.vx, S.vz);
  if (sp > 1.2 && S.mode === 'play') {
    let d = Math.atan2(S.vx, S.vz) - S.camYaw;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    S.camYaw += d * Math.min(1, dt * 1.6 * Math.min(1, sp / 6));
  }
  S.camYaw += orbit * dt;
  const want = 5 + S.r * 6;
  S.camDist += (want - S.camDist) * Math.min(1, dt * 2.2);
  const dist = S.camDist, fx = Math.sin(S.camYaw), fz = Math.cos(S.camYaw), c = ballRoot.position;
  let cx = c.x - fx * dist, cz = c.z - fz * dist, cy = c.y + dist * 0.78 + S.r * 0.6;   // high enough to see over trees
  cy = Math.max(cy, groundY(cx, cz) + 1.5);
  S.shake = Math.max(0, S.shake - dt * 1.6);
  const sh = S.shake * S.shake * (0.3 + S.r * 0.15);
  camera.position.set(cx + rand(-sh, sh), cy + rand(-sh, sh), cz + rand(-sh, sh));
  camera.lookAt(c.x + fx * (S.r * 2 + 1.5), c.y + S.r * 0.2, c.z + fz * (S.r * 2 + 1.5));
  scene.fog.near = dist * 1.4;
  scene.fog.far = dist * 7 + 160;
}

// ============ end screen and share card
function bestRecord() { try { return JSON.parse(localStorage.getItem('degul-best') || 'null'); } catch { return null; } }
function showEnd() {
  S.mode = 'over';
  const d = S.maxD, best = bestRecord();
  const isBest = !best || d > best.d;
  if (isBest) try { localStorage.setItem('degul-best', JSON.stringify({ d, t: S.t, n: S.picks })); } catch {}
  $('endTitle').textContent = S.win ? '캠퍼스를 통째로 뭉쳤어요!' : '기운이 다 빠졌어요';
  $('endWhy').textContent = S.win ? '중앙대 건물이 하나도 안 남았어요' : '멈추지 말고 계속 붙여야 기운이 차요';
  $('eDia').textContent = `${fmtD(d)} m`;
  $('eTime').textContent = fmtT(S.t);
  $('eCount').textContent = `${S.picks.toLocaleString()}개`;
  $('eGrade').textContent = GRADES[S.grade].n;
  $('eBig').textContent = S.biggest ? S.biggest.name : '없음';
  $('eRec').textContent = isBest ? (best ? '최고 기록 경신!' : '첫 기록!') : `최고 기록 ${fmtD(best.d)} m`;
  $('end').hidden = false;
  $('hud').hidden = true;
}
async function shareCard() {
  // frame the ball, render once, and copy the frame before the browser clears it
  placeCamera(0);
  renderer.render(scene, camera);
  const src = renderer.domElement, cv = document.createElement('canvas');
  cv.width = 1080; cv.height = 1350;
  const g = cv.getContext('2d');
  g.fillStyle = '#16141a'; g.fillRect(0, 0, 1080, 1350);
  const sw = src.width, sh = src.height, side = Math.min(sw, sh * 0.8);
  g.drawImage(src, (sw - side) / 2, (sh - side) / 2, side, side, 60, 190, 960, 960);
  g.fillStyle = '#ffa620'; g.font = '110px "Black Han Sans"'; g.textBaseline = 'top';
  g.fillText('데굴', 60, 50);
  g.fillStyle = '#f4efe6'; g.font = '700 34px -apple-system, "Apple SD Gothic Neo", sans-serif';
  g.fillText('중앙대를 굴려서 뭉쳐 봐', 330, 98);
  g.fillStyle = '#f4efe6'; g.font = '84px "Black Han Sans"';
  g.fillText(`${fmtD(S.maxD)} m`, 60, 1170);
  g.font = '700 34px -apple-system, "Apple SD Gothic Neo", sans-serif'; g.fillStyle = '#a59f95';
  g.fillText(`${fmtT(S.t)} · ${S.picks.toLocaleString()}개 · ${GRADES[S.grade].n}`, 60, 1270);
  g.textAlign = 'right'; g.fillStyle = '#ffa620';
  g.fillText(S.biggest ? `${S.biggest.name}까지` : '', 1020, 1185);
  const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
  const file = new File([blob], 'degul.png', { type: 'image/png' });
  if (COARSE && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], text: `데굴: 중앙대에서 ${fmtD(S.maxD)} m짜리 공을 만들었어요` }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'degul.png'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ============ game flow
function clearBall() {
  for (const k in STUCK) { const st = STUCK[k]; for (let i = 0; i < st.cap; i++) st.mesh.setMatrixAt(i, ZERO); st.owner.fill(0); st.ring = 0; st.mesh.count = 0; st.mesh.instanceMatrix.needsUpdate = true; }
  tweens.length = 0;
  ballSpin.quaternion.identity();
  twinMesh.visible = false;
}
function restoreWorld() {
  // put every object and building back where it started
  for (const o of flying) hideObj(o);
  flying.length = 0;
  for (const k in WORLD) { const w = WORLD[k]; w.free.length = 0; const cap = w.mesh.instanceMatrix.count; for (let i = cap - 1; i >= 0; i--) { w.mesh.setMatrixAt(i, ZERO); w.free.push(i); } w.mesh.count = 0; }
  OBJ.length = ORIGINAL.length;
  GRID.clear();
  for (let i = 0; i < ORIGINAL.length; i++) { const o = (OBJ[i] = { ...ORIGINAL[i], alive: true, slot: -1 }); showObj(o); gridAdd(o); }
  for (const b of BLD) {
    b.alive = true; b.hitCd = 0;
    scene.attach(b.mesh);
    b.mesh.position.set(b.cx, b.base, b.cz); b.mesh.quaternion.identity();
  }
}
const ORIGINAL = OBJ.map((o) => ({ ...o }));
function startGame(fresh = true) {
  if (fresh) { restoreWorld(); clearBall(); }
  resetGame();
  S.mode = 'play';
  S.camDist = 5 + S.r * 6;
  $('start').hidden = true; $('end').hidden = true; $('hud').hidden = false;
  hudCache = '';
  placeBall(0); placeCamera(0);
}
$('go').onclick = () => { initAudio(); startGame(false); toast('화면을 끌어서 굴려요', 2200); };
$('again').onclick = () => { initAudio(); startGame(true); };
$('share').onclick = () => shareCard();

// ============ main loop
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.min(0.1, (now - last) / 1000);
  last = now;
  const dt = Math.min(1 / 30, raw);
  if (S.mode === 'play') {
    if (S.hitstop > 0) S.hitstop -= dt;
    else step(dt);
  } else if (S.mode === 'ending') {
    S.endT += dt;
    const k = Math.exp(-2.5 * dt); S.vx *= k; S.vz *= k;
    S.x += S.vx * dt; S.z += S.vz * dt;
    if (S.endT > 1.6) showEnd();
  }
  updateTweens(dt);
  placeBall(dt);
  placeCamera(dt, S.mode === 'ending' || S.mode === 'over' || S.mode === 'start' ? 0.35 : 0);
  if (AC && rollGain) {
    const sp = Math.hypot(S.vx, S.vz);
    rollGain.gain.setTargetAtTime(S.mode === 'play' ? Math.min(0.3, sp * 0.03) : 0, AC.currentTime, 0.08);
    rollFilter.frequency.setTargetAtTime(160 + 700 / (1 + S.r * 0.25) + sp * 8, AC.currentTime, 0.1);
  }
  if (S.mode === 'play' || S.mode === 'ending') updateHud();
  renderer.render(scene, camera);
  // lower the resolution when frames are slow
  fpsAcc += raw; fpsN++;
  if (fpsAcc > 2) {
    const fps = fpsN / fpsAcc;
    if (fps < 45 && pixelRatio > PR_MIN) { pixelRatio = Math.max(PR_MIN, pixelRatio - 0.15); renderer.setPixelRatio(pixelRatio); resize(); }
    else if (fps > 58 && pixelRatio < PR_MAX) { pixelRatio = Math.min(PR_MAX, pixelRatio + 0.1); renderer.setPixelRatio(pixelRatio); resize(); }
    fpsAcc = 0; fpsN = 0;
  }
}

resetGame();
placeBall(0); placeCamera(0);
const best = bestRecord();
if (best) $('best').textContent = `최고 기록 ${fmtD(best.d)} m · ${best.n.toLocaleString()}개`;
$('loading').hidden = true;
$('start').hidden = false;
if (BOT.on) startGame(false);
requestAnimationFrame(frame);

// ============ test handle
window.__degul = {
  S, BLD, OBJ, KINDS, CARDS, STUCK, ballSpin, ballRoot, core, tweens,
  // draw n frames back to back and wait for the GPU, to measure ms per frame even when rAF is throttled
  bench(n = 20) {
    const gl = renderer.getContext(), px = new Uint8Array(4), t0 = performance.now();
    for (let i = 0; i < n; i++) { renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
    return { ms: +((performance.now() - t0) / n).toFixed(2), calls: renderer.info.render.calls, tris: renderer.info.render.triangles, pr: pixelRatio };
  },
  start: () => startGame(true),
  bot: (on = true) => { BOT.on = on; },
  // run the game logic for `sec` seconds without drawing; returns diameter over time
  sim(sec = 180, dt = 1 / 30, every = 10) {
    const log = [];
    let next = 0;
    for (let t = 0; t < sec && (S.mode === 'play' || S.mode === 'card'); t += dt) {
      if (S.mode === 'card') chooseCard(CARDS.find((c) => S.lv[c.id] < 3).id);
      step(dt); updateTweens(dt); placeBall(dt);
      if (S.t >= next) { log.push({ t: Math.round(S.t), d: +(2 * S.r).toFixed(2), E: +S.E.toFixed(2), n: S.picks, g: GRADES[S.grade].n, b: BLD.filter((b) => !b.alive).length }); next += every; }
    }
    log.push({ end: S.mode, t: +S.t.toFixed(1), d: +(2 * S.r).toFixed(2), n: S.picks, lv: { ...S.lv } });
    return log;
  },
  // draw the current state once (the in-app browser pauses rAF while its pane is hidden)
  snap() { updateTweens(1); placeBall(0); placeCamera(0); updateHud(); renderer.render(scene, camera); return { d: +(2 * S.r).toFixed(2), mode: S.mode }; },
  counts: () => Object.fromEntries(Object.keys(KINDS).map((k) => [k, OBJ.filter((o) => o.k === k).length])),
  card: (i) => document.querySelectorAll('.card')[i]?.click(),
  end: () => { S.E = 0; },
  finish: () => showEnd(),
  cards: () => { S.pendingCards++; openCards(); },
};
</script>
</body>
</html>
