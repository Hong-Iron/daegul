<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>데굴 — 전국 대학을 굴러 내려가 봐</title>
<meta name="description" content="강원도 경동대에서 제주대까지, 전국 대학 캠퍼스를 북쪽부터 남쪽으로 이어 붙인 내리막을 공으로 굴러 내려가며 물건과 건물을 붙이는 3D 웹게임">
<meta name="theme-color" content="#16141a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root { --bg: #16141a; --panel: #232028; --line: #3a3640; --ink: #f4efe6; --mute: #a59f95; --acc: #ffa620; --bad: #e5484d; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; }
.big { font-family: "Black Han Sans", sans-serif; font-weight: 400; letter-spacing: 0.01em; }
[hidden] { display: none !important; }
.sh { text-shadow: 0 1px 0 rgba(0,0,0,.6); }

#hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 12px) 16px 0; pointer-events: none; }
#hud .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
#scorebox { display: inline-block; transform-origin: left top; }
#scorebox.pulse { animation: pulse .45s ease-out; }
@keyframes pulse { 0% { transform: scale(1); } 35% { transform: scale(1.5); color: var(--acc); } 100% { transform: scale(1); } }
#score { font-size: 44px; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
#scorebox span { display: block; font-size: 12px; font-weight: 700; color: var(--ink); opacity: .85; margin-bottom: 2px; }
#dia { margin-top: 6px; font-size: 14px; font-weight: 700; }
#dia b { color: var(--acc); }
#side { text-align: right; font-size: 14px; font-weight: 700; line-height: 1.5; }
#pauseBtn { pointer-events: auto; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; margin-bottom: 4px;
  border: 0; border-radius: 8px; background: rgba(22,20,26,.62); cursor: pointer; padding: 0; }
#pauseBtn i { display: block; width: 4px; height: 14px; background: var(--ink); border-radius: 1px; margin: 0 2px; }
#pause h2 { margin: 0 0 16px; font-size: 26px; text-align: center; }
#dash { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 4px; background: var(--acc); color: #1b1408; font-size: 12px; text-shadow: none; }
#dash.cool { background: rgba(22,20,26,.55); color: var(--mute); }
#nav { position: absolute; left: 50%; top: calc(env(safe-area-inset-top) + 10px); transform: translateX(-50%); text-align: center; width: 136px; }
#nav svg { display: block; width: 46px; height: 46px; margin: 0 auto; filter: drop-shadow(0 2px 0 rgba(0,0,0,.4)); transition: transform .08s linear; }
#nav div { margin-top: 2px; font-size: 12px; font-weight: 700; line-height: 1.3; }
#nav b { display: block; font-size: 13px; color: var(--acc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sbox { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
#sbox span { font-size: 12px; font-weight: 700; }
#sbar { flex: 1; height: 8px; background: rgba(22,20,26,.55); border-radius: 4px; overflow: hidden; }
#sbar i { display: block; height: 100%; width: 100%; background: var(--acc); border-radius: 4px; transform-origin: left; }
#sbar.low i { background: var(--bad); }
#chal { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 150px); transform: translateX(-50%); pointer-events: none; text-align: center;
  background: rgba(22,20,26,.78); border: 1px solid var(--acc); border-radius: 8px; padding: 6px 12px; min-width: 180px; }
#chal b { display: block; font-size: 13px; color: var(--acc); }
#chal span { display: block; font-size: 15px; font-weight: 800; margin-top: 2px; }
#chal i { display: block; height: 5px; margin-top: 5px; border-radius: 3px; background: var(--acc); transform-origin: left; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.stages button { flex: 1 1 30%; background: transparent; border: 1px solid var(--line); color: var(--ink); font: inherit; font-size: 12px; font-weight: 700; padding: 7px 4px; border-radius: 6px; cursor: pointer; }
.stages button.on { border-color: var(--acc); color: var(--acc); }
.stages button.done::after { content: ' ✓'; color: var(--acc); }
.stages button:disabled { color: var(--mute); opacity: .5; cursor: default; }
#warn { position: fixed; left: 0; right: 0; top: 56%; text-align: center; pointer-events: none; font-size: 30px; color: var(--bad);
  text-shadow: 0 3px 0 rgba(0,0,0,.4); opacity: 0; transition: opacity .15s; }
#warn.on { opacity: 1; }

#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 160px); transform: translateX(-50%); pointer-events: none;
  background: rgba(22,20,26,.82); padding: 8px 14px; border-radius: 6px; font-size: 14px; font-weight: 700; white-space: nowrap;
  opacity: 0; transition: opacity .2s; }
#toast.on { opacity: 1; }
#banner { position: fixed; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; font-size: 46px; color: var(--ink);
  text-shadow: 0 4px 0 rgba(0,0,0,.45); opacity: 0; transform: scale(.8); transition: opacity .25s, transform .25s; padding: 0 16px; }
#banner.on { opacity: 1; transform: scale(1); }
#banner small { display: block; font-size: 22px; color: var(--acc); margin-top: 6px; }

#joy { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 2px solid rgba(244,239,230,.45); pointer-events: none; }
/* resting place while no finger is down: bottom middle */
#joy.rest { left: 50%; top: auto; bottom: calc(env(safe-area-inset-bottom) + 34px); margin: 0 0 0 -56px; opacity: .6; }
#mini { position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); width: 100px; padding: 6px; background: rgba(22,20,26,.62); border-radius: 8px; pointer-events: none; }
#mini canvas { display: block; width: 100px; height: 100px; }
#miniName { font-size: 11px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(244,239,230,.55); }

.layer { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(16,14,20,.72); z-index: 10; }
.panel { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px 18px; box-sizing: border-box; }
.btn { display: block; width: 100%; border: 0; border-radius: 8px; padding: 15px 0; font-size: 17px; font-weight: 800; cursor: pointer;
  background: var(--acc); color: #1b1408; font-family: inherit; }
.btn:disabled { opacity: .5; }
.btn.sub { background: transparent; color: var(--ink); border: 1px solid var(--line); margin-top: 10px; font-weight: 700; }
/* ranking on the result screen */
#end { align-items: flex-start; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
#end .panel { margin: auto 0; }
.head { display: flex; justify-content: space-between; align-items: center; font-size: 15px; margin-top: 4px; }
#nameBox label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.row2 { display: flex; gap: 8px; }
#name { flex: 1; min-width: 0; box-sizing: border-box; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font-size: 17px;
  padding: 11px 12px; font-family: inherit; -webkit-user-select: text; user-select: text; touch-action: auto; }
#name:focus { outline: none; border-color: var(--acc); }
.btn.small { width: auto; padding: 0 16px; font-size: 15px; }
.msg { min-height: 18px; font-size: 12px; color: var(--mute); margin: 6px 0 8px; }
.msg.bad { color: var(--bad); }
.myrank { text-align: center; font-size: 14px; font-weight: 700; margin: 0 0 10px; min-height: 1em; }
.myrank b { color: var(--acc); }
.link { background: none; border: 0; color: var(--mute); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0 0 0 6px; }
.tabs button { background: transparent; border: 1px solid var(--line); color: var(--mute); font: inherit; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 6px; margin-left: 4px; cursor: pointer; }
.tabs button.on { background: var(--acc); color: #1b1408; border-color: var(--acc); }
#rank { list-style: none; margin: 6px 0 14px; padding: 0; }
#rank li { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 7px 2px; border-top: 1px solid var(--line); font-size: 14px; }
#rank li:first-child { border-top: 0; }
#rank .n { font-family: "Black Han Sans", sans-serif; color: var(--mute); text-align: center; }
#rank li:nth-child(-n+3) .n { color: var(--acc); }
#rank .who b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#rank .who span { font-size: 11px; color: var(--mute); }
#rank .sc { font-family: "Black Han Sans", sans-serif; font-size: 16px; }
#rank li.me { background: rgba(255,166,32,.1); border-radius: 6px; }
#rank li.empty { display: block; color: var(--mute); text-align: center; padding: 12px 0; border: 0; }
#cards h2 { margin: 0 0 4px; font-size: 22px; text-align: center; }
#cards p.h { margin: 0 0 14px; text-align: center; color: var(--mute); font-size: 13px; }
.card { display: block; width: 100%; text-align: left; background: #2c2832; border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-top: 10px;
  color: var(--ink); font-family: inherit; cursor: pointer; }
.card b { font-size: 17px; }
.card .lv { float: right; color: var(--acc); font-size: 14px; font-weight: 800; }
.card div { margin-top: 4px; font-size: 13px; color: var(--mute); line-height: 1.45; }
.card .lv em { font-style: normal; font-size: 17px; }
.card:active { border-color: var(--acc); }
#end h2 { margin: 0; font-size: 26px; text-align: center; color: var(--acc); }
#end .why { text-align: center; color: var(--mute); font-size: 13px; margin: 6px 0 16px; }
#end dl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 16px; }
#end dl div { background: #2c2832; border-radius: 8px; padding: 10px 12px; }
#end dt { font-size: 12px; color: var(--mute); }
#end dd { margin: 2px 0 0; font-size: 20px; }
#end dl div.wide { grid-column: span 2; }
#end .rec { text-align: center; font-size: 13px; color: var(--acc); margin: -6px 0 12px; min-height: 1em; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--mute); font-size: 14px; z-index: 20; background: var(--bg); }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">전국 대학을 불러오는 중…</div>

<div id="hud" hidden>
  <div class="row">
    <div>
      <div id="scorebox" class="sh"><span>점수</span><div id="score" class="big">0</div></div>
      <div id="dia" class="sh">지름 1.00 m · <b>캔급</b></div>
    </div>
    <div id="side" class="sh"><button id="pauseBtn" aria-label="잠깐 멈추기"><i></i><i></i></button><div id="time">0:00</div><div id="arr">도착 0곳</div><div id="dash">돌진</div></div>
  </div>
  <div id="nav" class="sh"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 L41 37 L24 29 L7 37 Z" fill="#ffa620" stroke="#1b1408" stroke-width="2.5" stroke-linejoin="round"/></svg><div><b id="navName"></b><span id="navDist"></span></div></div>
  <div id="sbox" class="sh"><span>속도</span><div id="sbar"><i></i></div></div>
</div>
<div id="toast"></div>
<div id="banner" class="big"></div>
<div id="warn" class="big">멈추면 끝!</div>
<div id="chal" hidden><b id="chalT"></b><span id="chalG"></span><i id="chalBar"></i></div>
<div id="joy" class="rest" hidden><i></i></div>
<div id="mini" hidden><div id="miniName"></div><canvas id="miniC"></canvas></div>

<div id="pause" class="layer" hidden>
  <div class="panel">
    <h2 class="big">잠깐 멈춤</h2>
    <button class="btn" id="resume">계속하기</button>
    <button class="btn sub" id="restart">처음부터 다시</button>
    <button class="btn sub" id="quit">그만하고 결과 보기</button>
  </div>
</div>

<div id="cards" class="layer" hidden>
  <div class="panel">
    <h2>강화 고르기</h2>
    <p class="h">하나만 고를 수 있어요</p>
    <div id="cardlist"></div>
  </div>
</div>

<div id="end" class="layer" hidden>
  <div class="panel">
    <h2 class="big" id="endTitle">멈춰 버렸어요</h2>
    <div class="why" id="endWhy"></div>
    <dl>
      <div><dt>점수</dt><dd class="big" id="eScore"></dd></div>
      <div><dt>도착</dt><dd class="big" id="eArr"></dd></div>
      <div><dt>지름</dt><dd class="big" id="eDia"></dd></div>
      <div><dt>시간</dt><dd class="big" id="eTime"></dd></div>
      <div class="wide"><dt>마지막 도착</dt><dd id="eLast"></dd></div>
    </dl>
    <div class="rec" id="eRec"></div>
    <div id="nameBox">
      <label for="name">랭킹에 올릴 이름</label>
      <div class="row2"><input id="name" maxlength="16" autocomplete="nickname" enterkeyhint="send" placeholder="2~10글자"><button class="btn small" id="post">올리기</button></div>
      <div id="nameMsg" class="msg">한 번 정하면 다음 판부터는 저절로 올라가요</div>
    </div>
    <div id="eRank" class="myrank"></div>
    <div class="head"><b>도시</b></div>
    <div class="stages" id="stages"></div>
    <div class="head"><b id="rankTitle">랭킹</b><div class="tabs"><button data-scope="today" class="on">오늘</button><button data-scope="all">전체</button></div></div>
    <ol id="rank"></ol>
    <button class="btn" id="again">한 판 더</button>
    <button class="btn sub" id="share">결과 카드 저장</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { checkName, nameKey } from './names.js';

const $ = (id) => document.getElementById(id);
const QS = new URLSearchParams(location.search);
const COARSE = matchMedia('(pointer: coarse)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
// each campus lays out its props from its own seed, so a campus looks the same every run
let seed = 1;
const srand = () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);
const srange = (a, b) => a + srand() * (b - a);
const pick = (a) => a[Math.floor(srand() * a.length)];
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

// ============ course: campuses north → south, one after another down a long slope
// every campus, in the file's order (north → south); k is its place on the start-page map
let ALL;
try {
  ALL = await (await fetch('course/index.json')).json();
} catch (err) {
  $('loading').textContent = '코스 데이터를 불러오지 못했어요. 새로고침해 주세요.';
  throw err;
}
ALL.forEach((c, k) => { c.k = k; });
const SLOPE = 0.1, GAP = 60, SIDE = 40;
// stages: one city at a time. A run is STAGE_N random campuses of that city and then its boss campus;
// between campuses lies a stretch with a challenge
const STAGES = [
  { id: 'seoul', name: '서울' }, { id: 'gyeonggi', name: '경기·인천' }, { id: 'gangwon', name: '강원' }, { id: 'chungcheong', name: '충청' },
  { id: 'jeolla', name: '전라·제주' }, { id: 'gyeongbuk', name: '대구·경북' }, { id: 'gyeongnam', name: '부산·울산·경남' },
];
const STAGE_N = 6, ZL = 240, CHALLENGES = ['park', 'wall', 'time'];
const stored = (k, v) => { try { return JSON.parse(localStorage.getItem(k)) ?? v; } catch { return v; } };
const cleared = new Set(stored('degul-cleared', []));
const unlocked = (i) => i === 0 || cleared.has(STAGES[i - 1].id) || cleared.has(STAGES[i].id);
let stageIx = clamp(STAGES.findIndex((x) => x.id === stored('degul-stage', 'seoul')), 0, STAGES.length - 1);
if (!unlocked(stageIx)) stageIx = 0;
const curStage = () => STAGES[stageIx];
// Korean particle after a word: josa('서울', '이', '가') → '서울이'
const josa = (w, withB, without) => { const c = w.charCodeAt(w.length - 1); return w + (c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 > 0 ? withB : without); };
const COURSE = [];
let GEN = 0;                        // bumps on every new order, so files still on their way for the old one are ignored
function newOrder(first = null) {
  for (const c of [...LOADED]) unloadSeg(c);
  GEN++;
  const pool = ALL.filter((c) => c.stage === curStage().id && !c.boss), boss = ALL.find((c) => c.stage === curStage().id && c.boss);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const a = pool.slice(0, STAGE_N);
  if (first) { const f = ALL.find((c) => c.code === first); if (f && !f.boss) a[0] = f; }   // tests can pick the first campus
  a.push(boss);
  COURSE.length = 0; COURSE.push(...a);
  // challenges in a shuffled cycle, never the same twice in a row
  let kinds = [];
  let z = 0;
  COURSE.forEach((c, i) => {
    c.i = i; c.zs = z; c.zc = z + 20 + c.d / 2; c.ze = z + c.d + 40; c.halfW = Math.max(70, c.w / 2 + SIDE);
    c.loading = false; c.chalDone = false;
    if (i < COURSE.length - 1) {
      if (!kinds.length) kinds = [...CHALLENGES].sort(() => Math.random() - 0.5);
      if (i > 0 && kinds[0] === COURSE[i - 1].chal) kinds.push(kinds.shift());
      c.chal = kinds.shift();
    } else c.chal = null;
    z = c.ze + (c.chal ? ZL : 0) + GAP;
  });
}
const groundY = (x, z) => -SLOPE * z;
function segIndexAt(z) {
  let lo = 0, hi = COURSE.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (COURSE[m].zs - GAP / 2 <= z) lo = m; else hi = m - 1; }
  return lo;
}
function halfWidthAt(z) {
  const c = COURSE[segIndexAt(z)], n = COURSE[c.i + 1];
  return z > c.ze && n ? Math.max(c.halfW, n.halfW) : c.halfW;
}
function inPoly(x, z, p) {
  let c = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const xi = p[i][0], zi = p[i][1], xj = p[j][0], zj = p[j][1];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) c = !c;
  }
  return c;
}
function closestOnPoly(x, z, p) {
  let best = Infinity, bx = 0, bz = 0;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const ax = p[j][0], az = p[j][1], dx = p[i][0] - ax, dz = p[i][1] - az;
    const t = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz || 1e-9), 0, 1);
    const qx = ax + t * dx, qz = az + t * dz, d = (x - qx) ** 2 + (z - qz) ** 2;
    if (d < best) { best = d; bx = qx; bz = qz; }
  }
  return [bx, bz, Math.sqrt(best)];
}

// ============ renderer, scene
const stage = $('stage');
const PR_MAX = Math.min(devicePixelRatio || 1, COARSE ? 1.5 : 2), PR_MIN = COARSE ? 0.75 : 1;
let pixelRatio = PR_MAX;
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: !(COARSE && devicePixelRatio >= 2), powerPreference: 'high-performance' });
} catch (err) {
  $('loading').textContent = '이 브라우저에서 WebGL을 쓸 수 없어 3D 화면을 그리지 못했어요.';
  throw err;
}
renderer.setPixelRatio(pixelRatio);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const SKY = new THREE.Color('#a9c6dd');
scene.background = SKY.clone();
scene.fog = new THREE.Fog(SKY.clone(), 80, 500);

const CELL = 6, GX0 = -6000, GZ0 = -3000;
const GRID = new Map();
const gkey = (ix, iz) => ix * 65536 + iz;
function gridAdd(o) {

}
function gridEach(x, z, rad, fn) {

  const j0 = Math.floor((z - rad - GZ0) / CELL), j1 = Math.floor((z + rad - GZ0) / CELL);
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
    const a = GRID.get(gkey(i, j));
    if (!a) continue;
    for (let n = a.length - 1; n >= 0; n--) {

// ============ ground for one campus
function makeGround(c, d) {
  // the first campus also gets ground behind the start line, so the camera never looks past the edge
  const z0 = c.zs - GAP / 2 - (c.i === 0 ? 600 : 0), z1 = c.ze + GAP / 2 + (c.chal ? ZL : 0) + (c.i === COURSE.length - 1 ? 400 : 0);
  const hw = Math.max(c.halfW, COURSE[c.i + 1]?.halfW || 0) + 160, Wd = 2 * hw, Hd = z1 - z0;
  const PX = Math.min(2.5, 1600 / Math.max(Wd, Hd));

  cv.width = Math.ceil(Wd * PX); cv.height = Math.ceil(Hd * PX);
  const g = cv.getContext('2d');
  const X = (x) => (x + hw) * PX, Y = (z) => (z - z0) * PX;
  const ring = (r) => { g.beginPath(); r.forEach(([x, z], i) => (i ? g.lineTo(X(x), Y(z + c.zc)) : g.moveTo(X(x), Y(z + c.zc)))); g.closePath(); };
  g.fillStyle = '#5f7d52'; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = '#8e9b7c'; g.fillRect(X(-c.halfW), 0, (2 * c.halfW) * PX, cv.height);
  if (d.campus.length) { g.fillStyle = '#a3b683'; ring(d.campus); g.fill(); }
  const LC = { wood: '#5f8a4c', park: '#8fbb6a', pitch: '#4f9a5a', water: '#5d9cc4', res: '#b5ad9e' };
  for (const l of d.lands) for (const r of l.r) { g.fillStyle = LC[l.k] || '#9aa983'; ring(r); g.fill(); }
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.fillStyle = g.strokeStyle = '#cdc5b4'; g.lineWidth = 10 * PX;
  for (const b of d.buildings) { ring(b.o); g.fill(); g.stroke(); }
  // the road that links one campus to the next
  g.strokeStyle = '#77767b'; g.lineWidth = 12 * PX;
  g.beginPath(); g.moveTo(X(0), 0); g.lineTo(X(0), Y(c.zs + 20)); g.moveTo(X(0), Y(c.ze - 20)); g.lineTo(X(0), cv.height); g.stroke();
  const RW = { motorway: [16, '#6f6e73'], trunk: [14, '#6f6e73'], primary: [13, '#6f6e73'], secondary: [12, '#6f6e73'], tertiary: [11, '#6f6e73'],
    residential: [8, '#77767b'], service: [6, '#8e8d91'], pedestrian: [5, '#d6ccba'], footway: [3, '#d6ccba'], steps: [3.5, '#c7bca8'], path: [2.5, '#cbbfa8'] };
  for (const r of d.roads) {
    const [w, col] = RW[r.k] || [3, '#c9bfa9'];
    g.strokeStyle = col; g.lineWidth = w * PX;
    g.beginPath(); r.p.forEach(([x, z], i) => (i ? g.lineTo(X(x), Y(z + c.zc)) : g.moveTo(X(x), Y(z + c.zc)))); g.stroke();
  }
  if (c.chal) {
    // the challenge stretch: a parking lot, a building site, or a race track
    const za = Y(c.ze), zb = Y(c.ze + ZL), cw = Math.min(c.halfW, 120);
    g.fillStyle = { park: '#6c6b70', wall: '#a88b5c', time: '#5d5c62' }[c.chal];
    g.fillRect(X(-cw), za, 2 * cw * PX, zb - za);

const _inv = new THREE.Quaternion(), _n = new THREE.Vector3(), _qt = new THREE.Quaternion(), _X = new THREE.Vector3(1, 0, 0);
function stickTransform(wx, wy, wz, worldQ, outFrom, outQa, outTo, outQb, depth) {
  _inv.copy(ballSpin.quaternion).invert();
  outFrom.set(wx - ballRoot.position.x, wy - ballRoot.position.y, wz - ballRoot.position.z).applyQuaternion(_inv);
  _n.copy(outFrom);
  if (_n.lengthSq() < 1e-6) _n.set(rand(-1, 1), rand(-1, 1), rand(-1, 1));
  _n.normalize();
  outTo.copy(_n).multiplyScalar(S.r * depth);
  outQa.copy(_inv).multiply(worldQ);
  // stand the thing up on the surface, spun and tilted a little
  outQb.setFromUnitVectors(UP, _n).multiply(_qt.setFromAxisAngle(UP, rand(0, 6.28)));
  outQb.multiply(_qt.setFromAxisAngle(_X, rand(-0.5, 0.5)));
}
function addVolume(dv, s, name) {
  const f = dv / S.V;
  S.V += dv; S.r = radOf(S.V); S.picks++;
  if (!S.biggest || s > S.biggest.s) S.biggest = { s, name };
  if (f > 0.1) { S.hitstop = Math.max(S.hitstop, 0.04); vib(12); }
}
function pickObj(o) {
  if (!o.alive) return;
  if (o.k === 'piece') { stickPiece(o); return; }
  o.alive = false;
  hideObj(o);
  addVolume(o.vol * grow(), o.s, KINDS[o.k].name);
  if (o.chal && S.chal && S.chal.type === 'park') S.chal.got++;
  const st = STUCK[o.k], slot = st.ring++ % st.cap, tk = ++token;
  st.mesh.count = Math.min(st.cap, st.ring);
  st.owner[slot] = tk;
  st.mesh.setColorAt(slot, _c.set(o.color || 0xffffff)); st.mesh.userData.colorDirty = true;
  const tw = { st, slot, tk, sc: o.sc, t: 0, dur: 0.22, from: new THREE.Vector3(), qa: new THREE.Quaternion(), to: new THREE.Vector3(), qb: new THREE.Quaternion() };
  _q.setFromAxisAngle(UP, o.yaw);
  stickTransform(o.x, o.y, o.z, _q, tw.from, tw.qa, tw.to, tw.qb, 0.84);
  tweens.push(tw);
  S.recent.push({ k: o.k, slot, tk, s: o.s, vol: o.vol, sc: o.sc, color: o.color });
  if (S.recent.length > 40) S.recent.shift();
  sfxPop(o.s);

}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    const a = Math.min(1, tw.t / tw.dur), e = 1 - (1 - a) ** 3;
    if (tw.st.owner[tw.slot] !== tw.tk) { tweens.splice(i, 1); continue; }
    _p.lerpVectors(tw.from, tw.to, e);
    _q.slerpQuaternions(tw.qa, tw.qb, e);
    _m.compose(_p, _q, _s.setScalar(tw.sc));

}
// a block that sticks moves from the world mesh into the ball's own block mesh
function stickPiece(p) {

  const wasFlying = p.state === 'loose' && !p.alive;
  p.state = 'stuck'; p.alive = false;
  if (wasFlying) { const i = flying.indexOf(p); if (i >= 0) flying.splice(i, 1); }
  addVolume(p.vol * grow(), p.s, `${p.b.name} 조각`);
  const slot = S.spRing++ % SPCAP;
  const old = STUCKP[slot];
  const e = { p, slot, t: 0, dur: 0.3, from: new THREE.Vector3(), qa: new THREE.Quaternion(), to: new THREE.Vector3(), qb: new THREE.Quaternion() };
  stickTransform(p.x, p.y, p.z, p.q, e.from, e.qa, e.to, e.qb, 0.8);
  e.pos = e.from.clone(); e.q = e.qa.clone(); e.n = e.to.clone().normalize();

    e.to.copy(e.n).multiplyScalar(S.r * 0.86);
    if (e.t < e.dur) {

function launch(k, x, y, z, vx, vy, vz, sc, color) {

function updateFlying(dt) {

// ============ cards

  input.active = false; joy.hidden = true;
  const list = $('cardlist');

    const l = S.lv[c.id], b = document.createElement('button');

    b.innerHTML = `<b>${c.name}</b><span class="lv">Lv.${l} → <em>${l + 1}</em>${c.max && l + 1 >= c.max ? ' (최대)' : ''}</span><div>${c.what(l)}</div>`;
    b.onclick = () => chooseCard(c.id);

}
function chooseCard(id) {
  S.lv[id]++;
  sfxClick();
  $('cards').hidden = true;
  S.mode = 'play';
  joy.hidden = false; joyRest();

// ============ update

function botInput(dt) {

  const lim = ratio() * 2 * S.r, hw = halfWidthAt(S.z) - S.r - 2;
  if (BOT.t <= 0) {
    BOT.t = 0.25;
    let best = 0, bx = S.x;
    gridEach(S.x, S.z + 25 + S.r * 3, 30 + S.r * 3, (o) => {

}

// ============ ball and camera visuals
const _axis = new THREE.Vector3();
function placeBall(dt) {
  const r = S.r, sp = Math.hypot(S.vx, S.vz);

    _axis.set(S.vz, 0, -S.vx).normalize();
    ballSpin.quaternion.premultiply(_qt.setFromAxisAngle(_axis, (sp * dt) / r));
    S.roll += (sp * dt) / r;
  }
  S.lump = Math.max(0, S.lump - dt * 0.02);
  const wob = S.lump * r * 0.3 * Math.abs(Math.sin(S.roll));
  const gy = groundY(S.x, S.z);
  ballRoot.position.set(S.x, gy + r * 0.9 + wob, S.z);
  core.scale.setScalar(r * 0.88);
  shadow.position.set(S.x, gy + 0.05, S.z);
  shadow.scale.setScalar(r * 2.6);
}
function placeCamera(dt, orbit = 0) {
  const sp = Math.hypot(S.vx, S.vz);
  // look down the course, leaning a little toward where the ball is heading
  let want = 0;
  if (sp > 1.2 && S.mode === 'play') want = clamp(Math.atan2(S.vx, S.vz), -0.45, 0.45);
  if (orbit) S.camYaw += orbit * dt;
  else S.camYaw += (want - S.camYaw) * Math.min(1, dt * 2.5);
  const fov = (innerWidth < innerHeight ? 62 : 52) + (S.boost > 0 ? 12 * (S.boost / 0.7) : 0);
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 10 || 1); camera.updateProjectionMatrix(); }
  const wantD = 7 + S.r * 5.5;
  S.camDist += (wantD - S.camDist) * Math.min(1, dt * 2.2);
  const dist = S.camDist, fx = Math.sin(S.camYaw), fz = Math.cos(S.camYaw), c = ballRoot.position;
  const cx = c.x - fx * dist, cz = c.z - fz * dist;
  const cy = Math.max(c.y + dist * 0.62 + S.r * 0.6, groundY(cx, cz) + 2);
  S.shake = Math.max(0, S.shake - dt * 1.6);
  const sh = S.shake * S.shake * (0.3 + S.r * 0.15);
  camera.position.set(cx + rand(-sh, sh), cy + rand(-sh, sh), cz + rand(-sh, sh));
  const ahead = S.r * 2.5 + 6;
  camera.lookAt(c.x + fx * ahead, groundY(0, c.z + fz * ahead) + S.r * 0.6, c.z + fz * ahead);
  scene.fog.near = dist * 1.6;
  scene.fog.far = dist * 7 + 380;
}

  $('endTitle').textContent = S.clear ? `${curStage().name} 클리어!` : S.missed ? '목표를 놓쳤어요' : S.quit ? '여기까지 굴렀어요' : '멈춰 버렸어요';
  $('endWhy').textContent = S.clear ? (STAGES[stageIx + 1] ? `${josa(STAGES[stageIx + 1].name, '이', '가')} 열렸어요` : '모든 도시를 깼어요!')
    : S.missed ? `${boss.label}의 ${josa(boss.target ? boss.target.name : '목표 건물', '을', '를')} 무너뜨려야 해요` : S.quit ? '' : '큰 건물은 옆으로 피하거나, 두 번 톡 쳐서 돌진해 부수세요';
  drawStages();
  $('again').textContent = S.clear && STAGES[stageIx + 1] ? `다음 도시: ${STAGES[stageIx + 1].name}` : '한 판 더';
  $('eScore').textContent = sc.toLocaleString();
  $('eArr').textContent = `${S.arrived}곳`;
  $('eDia').textContent = `${fmtD(S.maxD)} m`;
  $('eTime').textContent = fmtT(S.t);
  $('eLast').textContent = S.last ? `${S.last}` : '아직 없음';
  $('eRec').textContent = isBest ? (best ? '최고 기록 경신!' : '첫 기록!') : `최고 기록 ${best.s.toLocaleString()}점`;
  $('end').hidden = false;
  $('hud').hidden = true;
  $('warn').classList.remove('on');
  rankOnEnd();
}
async function shareCard() {
  // frame the ball, render once, and copy the frame before the browser clears it
  placeCamera(0);
  flush();
  renderer.render(scene, camera);
  const src = renderer.domElement, cv = document.createElement('canvas');
  cv.width = 1080; cv.height = 1350;
  const g = cv.getContext('2d');
  g.fillStyle = '#16141a'; g.fillRect(0, 0, 1080, 1350);
  const sw = src.width, sh = src.height, side = Math.min(sw, sh * 0.8);
  g.drawImage(src, (sw - side) / 2, (sh - side) / 2, side, side, 60, 190, 960, 960);
  g.fillStyle = '#ffa620'; g.font = '110px "Black Han Sans"'; g.textBaseline = 'top';
  g.fillText('데굴', 60, 50);
  g.fillStyle = '#f4efe6'; g.font = '700 34px -apple-system, "Apple SD Gothic Neo", sans-serif';
  g.fillText('전국 대학을 굴러 내려가 봐', 330, 98);
  g.font = '84px "Black Han Sans"';
  g.fillText(`${score().toLocaleString()}점`, 60, 1170);
  g.font = '700 34px -apple-system, "Apple SD Gothic Neo", sans-serif'; g.fillStyle = '#a59f95';
  g.fillText(`${S.arrived}곳 도착 · 지름 ${fmtD(S.maxD)} m · ${fmtT(S.t)}`, 60, 1270);
  g.textAlign = 'right'; g.fillStyle = '#ffa620';
  if (S.last) g.fillText(`${S.last}까지`, 1020, 1185);
  const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
  const file = new File([blob], 'degul.png', { type: 'image/png' });
  if (COARSE && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], text: `데굴: ${S.arrived}곳을 지나 ${score().toLocaleString()}점` }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'degul.png'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// ============ game flow
function clearBall() {
  for (const k in STUCK) { const st = STUCK[k]; for (let i = 0; i < st.cap; i++) st.mesh.setMatrixAt(i, ZERO); st.owner.fill(0); st.ring = 0; st.mesh.count = 0; dirty(st.mesh, 0); dirty(st.mesh, st.cap - 1); }
  for (let i = 0; i < SPCAP; i++) SPM.setMatrixAt(i, ZERO);
  dirty(SPM, 0); dirty(SPM, SPCAP - 1);
  STUCKP.length = 0;
  tweens.length = 0;
  ballSpin.quaternion.identity();
  twinMesh.visible = false;
}
// a wide first campus would take ages with a fist-sized ball, so the ball starts bigger there:
// 1 m up to ~650 m across, then (size / 650)^1.6 — 2 m at 1 km, 6 m at 2 km
function startSize() {
  const c = COURSE[0], d0 = Math.max(1, (Math.max(c.w, c.d) / 650) ** 1.6);
  S.r = d0 / 2; S.V = volOf(S.r); S.maxD = d0;
  while (S.grade + 1 < GRADES.length && d0 >= GRADES[S.grade + 1].d) S.grade++;
  while (S.cardIx < CARD_AT.length && d0 >= CARD_AT[S.cardIx]) S.cardIx++;   // no free cards for the head start
}
async function prepare() {
  // drop whatever is loaded and bring in the first campuses again
  for (const c of [...LOADED]) unloadSeg(c);
  for (const c of COURSE) { c.loading = false; c.chalDone = false; }
  flying.length = 0;
  GRID.clear();
  clearBall();
  resetGame();
  startSize();
  await Promise.all(COURSE.slice(0, 3).map(loadSeg));
  placeBall(0); placeCamera(1);
}
function startGame() {
  S.mode = 'play';
  S.camDist = 7 + S.r * 5.5;
  $('end').hidden = true; $('hud').hidden = false;
  joy.hidden = false; joyRest(); input.active = false; input.x = input.y = 0; $('chal').hidden = true;
  last = performance.now();
  if (S.r * 2 > 1.5) toast(`넓은 ${COURSE[0].label}에서 출발해서 공을 ${fmtD(S.r * 2)} m로 키웠어요`, 2600);
  hudCache = '';
}
// ============ ranking (on the result screen)
const RANK = QS.get('rank') || (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8787' : 'https://degul-rank.smash-rank.workers.dev');
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let playerName = '', rankScope = 'today', posted = false;
try { playerName = checkName(localStorage.getItem('degul-name') || '').name || ''; } catch {}
const saveName = (n) => { playerName = n; try { localStorage.setItem('degul-name', n); } catch {} };
async function api(path, opt = {}) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 7000);
  try { return await (await fetch(RANK + path, { ...opt, signal: ctl.signal })).json(); } finally { clearTimeout(t); }
}
function showMine(html) {
  $('eRank').innerHTML = html;
  const b = $('rename');
  if (b) b.onclick = () => { $('nameBox').hidden = false; nameIn.value = playerName; validateName(); nameIn.focus(); };
}
async function submitRun(name) {
  posted = true; $('post').disabled = true;
  showMine('랭킹에 올리는 중…');
  try {
    const r = await api('/run', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ stage: curStage().id, name, score: score(), picks: S.picks, arrived: S.arrived, bonus: S.bonus, clear: S.clear, last: S.last, dia: +S.maxD.toFixed(2), secs: +S.t.toFixed(1) }) });
    if (r.ok) {
      saveName(name); $('nameBox').hidden = true;
      showMine(`<b>${esc(name)}</b> · ${curStage().name} ${r.rank}위 · 오늘 ${r.today}위<button class="link" id="rename">이름 바꾸기</button>`);
      loadRank();
    } else {
      showMine(r.why === 'too often' ? '조금 뒤에 다시 올릴 수 있어요' : '이 기록은 랭킹에 올리지 못했어요');
      if (r.why === 'too often') { posted = false; validateName(); }
    }
  } catch { showMine('랭킹 서버에 닿지 않아요'); posted = false; validateName(); }
}
async function loadRank() {
  const list = $('rank');
  list.innerHTML = '<li class="empty">불러오는 중…</li>';
  try {
    const { rows } = await api(`/board?scope=${rankScope}&stage=${curStage().id}`), mine = playerName ? nameKey(playerName) : '';
    list.innerHTML = rows.length ? rows.slice(0, 10).map((r, i) => `<li class="${nameKey(r.name) === mine ? 'me' : ''}"><span class="n">${i + 1}</span>
      <span class="who"><b>${esc(r.name)}</b><span>${r.last ? `${esc(r.last)}까지 · ` : ''}${r.arrived}곳</span></span><span class="sc">${r.score.toLocaleString()}</span></li>`).join('')
      : `<li class="empty">${rankScope === 'today' ? '오늘은' : '아직'} 기록이 없어요. 첫 기록을 남겨 보세요!</li>`;
  } catch { list.innerHTML = '<li class="empty">랭킹 서버에 닿지 않아요</li>'; }
}
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
  rankScope = b.dataset.scope;
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  loadRank();
}));
const nameIn = $('name');
function validateName() {
  const v = nameIn.value, r = checkName(v), msg = $('nameMsg');
  msg.textContent = !v.trim() ? '한 번 정하면 다음 판부터는 저절로 올라가요' : r.ok ? (posted ? '다음 판부터 이 이름으로 올라가요' : '좋아요!') : r.why;
  msg.classList.toggle('bad', !!v.trim() && !r.ok);
  $('post').disabled = !r.ok;
  $('post').textContent = posted ? '저장' : '올리기';
  return r;
}
nameIn.addEventListener('input', validateName);
nameIn.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter' && !$('post').disabled) $('post').click(); });
nameIn.addEventListener('keyup', (e) => e.stopPropagation());
$('post').onclick = () => {
  const r = validateName();
  if (!r.ok) return;
  if (!posted) { submitRun(r.name); return; }
  // this run is already on the board: the new name is kept for the next runs
  saveName(r.name); $('nameBox').hidden = true;
  showMine(`다음 판부터 <b>${esc(r.name)}</b>(으)로 올라가요<button class="link" id="rename">이름 바꾸기</button>`);
};
// on the result screen: post right away when a name is already saved, otherwise ask for one
function rankOnEnd() {
  posted = false;
  nameIn.value = playerName;
  $('nameBox').hidden = !!playerName && !BOT.on;
  showMine('');
  validateName();
  // a run quit in its first seconds is not worth a ranking row
  if (playerName && !BOT.on && S.t >= 3 && score() > 0) submitRun(playerName);
  loadRank();
}
function setStage(i) {
  stageIx = i;
  try { localStorage.setItem('degul-stage', JSON.stringify(curStage().id)); } catch {}
}
function drawStages() {
  const box = $('stages');
  box.innerHTML = '';
  STAGES.forEach((st, i) => {
    const b = document.createElement('button');
    b.textContent = st.name; b.disabled = !unlocked(i);
    b.classList.toggle('on', i === stageIx); b.classList.toggle('done', cleared.has(st.id));
    b.onclick = () => { setStage(i); drawStages(); $('again').textContent = `${st.name} 굴리기`; loadRank(); };
    box.appendChild(b);
  });
  $('rankTitle').textContent = `랭킹 · ${curStage().name}`;
}
$('again').onclick = async () => {
  initAudio(); $('end').hidden = true;
  if (S.clear && STAGES[stageIx + 1] && $('again').textContent.startsWith('다음')) setStage(stageIx + 1);
  newOrder(); await prepare(); startGame();
};
$('share').onclick = () => shareCard();
addEventListener('pointerdown', () => initAudio());

// ============ pause
function pause() {
  if (S.mode !== 'play') return;
  S.mode = 'pause';
  input.active = false; input.x = input.y = 0; joy.hidden = true;
  $('pause').hidden = false;
  if (AC) AC.suspend();
}
function resume() {
  if (S.mode !== 'pause') return;
  $('pause').hidden = true;
  S.mode = 'play'; joy.hidden = false; joyRest();
  last = performance.now();
  if (AC) AC.resume();
}
$('pauseBtn').addEventListener('pointerdown', (e) => e.stopPropagation());
$('pauseBtn').onclick = pause;
$('resume').onclick = resume;
$('restart').onclick = async () => { $('pause').hidden = true; if (AC) AC.resume(); newOrder(); await prepare(); startGame(); };
$('quit').onclick = () => { $('pause').hidden = true; if (AC) AC.resume(); S.quit = true; joy.hidden = true; $('mini').hidden = true; showEnd(); };
// leaving the app or tab pauses the run
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' || e.key === 'p') { if (S.mode === 'play') pause(); else if (S.mode === 'pause') resume(); } });

// ============ main loop
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.min(0.1, (now - last) / 1000);
  last = now;
  const dt = Math.min(1 / 30, raw);
  if (S.mode === 'play') {
    if (S.hitstop > 0) S.hitstop -= dt;
    else step(dt);
  } else if (S.mode === 'ending') {
    S.endT += dt;
    const k = Math.exp(-2.5 * dt); S.vx *= k; S.vz *= k;
    S.x += S.vx * dt; S.z += S.vz * dt;
    if (S.endT > 1.6) showEnd();
  }
  updateTweens(dt);
  placeBall(dt);
  updateStuckPieces(dt);
  placeCamera(dt, S.mode === 'ending' || S.mode === 'over' || S.mode === 'start' ? 0.35 : 0);
  if (AC && rollGain) {
    const sp = Math.hypot(S.vx, S.vz);
    rollGain.gain.setTargetAtTime(S.mode === 'play' ? Math.min(0.3, sp * 0.02) : 0, AC.currentTime, 0.08);
    rollFilter.frequency.setTargetAtTime(160 + 700 / (1 + S.r * 0.25) + sp * 6, AC.currentTime, 0.1);
  }
  if (S.mode === 'play' || S.mode === 'ending') updateHud();
  if (S.mode === 'play') drawMini(dt);
  flush();
  renderer.render(scene, camera);
  // lower the resolution when frames are slow
  fpsAcc += raw; fpsN++;
  if (fpsAcc > 2) {
    const fps = fpsN / fpsAcc;
    if (fps < 45 && pixelRatio > PR_MIN) { pixelRatio = Math.max(PR_MIN, pixelRatio - 0.15); renderer.setPixelRatio(pixelRatio); resize(); }
    else if (fps > 58 && pixelRatio < PR_MAX) { pixelRatio = Math.min(PR_MAX, pixelRatio + 0.1); renderer.setPixelRatio(pixelRatio); resize(); }
    fpsAcc = 0; fpsN = 0;
  }
}

// no title screen: the first campuses load and the ball starts rolling
newOrder();
requestAnimationFrame(frame);
await prepare();
$('loading').hidden = true;
startGame();
if (S.r * 2 <= 1.5) toast('화면을 좌우로 끌어서 방향을 틀어요', 2600);

// ============ test handle
window.__degul = {
  S, COURSE, LOADED, KINDS, CARDS, STUCKP, ballRoot, ballSpin,
  setStage: (id) => { const i = STAGES.findIndex((x) => x.id === id); if (i >= 0) { stageIx = i; newOrder(); } },
  start: async (first) => { if (first) newOrder(first); await prepare(); startGame(); },
  bot: (on = true) => { BOT.on = on; },
  // run the game logic for `sec` seconds without drawing; campuses still stream in (await between chunks)
  async sim(sec = 60, dt = 1 / 30, every = 10) {
    const log = [];
    let next = S.t;
    for (let t = 0; t < sec && S.mode === 'play'; t += dt) {
      step(dt); updateTweens(dt); placeBall(dt); updateStuckPieces(dt);
      if (S.t >= next) { log.push({ t: Math.round(S.t), d: +(2 * S.r).toFixed(1), sc: score(), a: S.arrived, z: Math.round(S.z), last: S.last, loaded: LOADED.length, p: 22000 - pFree.length }); next += every; }
      if (LOADED.some((c) => c.loading) || COURSE.some((c) => c.loading)) await new Promise((r) => setTimeout(r, 0));
    }
    log.push({ end: S.mode, win: S.win, clear: S.clear, missed: S.missed, bonus: S.bonus, t: +S.t.toFixed(1), d: +(2 * S.r).toFixed(1), sc: score(), a: S.arrived, stall: +S.stall.toFixed(2) });
    return log;
  },
  // draw the current state once (the in-app browser pauses rAF while its pane is hidden)
  snap() { updateTweens(1); placeBall(0); updateStuckPieces(1); placeCamera(1); updateHud(); flush(); renderer.render(scene, camera); return { d: +(2 * S.r).toFixed(2), mode: S.mode, sc: score() }; },
  bench(n = 20) {
    flush();
    const gl = renderer.getContext(), px = new Uint8Array(4), t0 = performance.now();
    for (let i = 0; i < n; i++) { renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
    return { ms: +((performance.now() - t0) / n).toFixed(2), calls: renderer.info.render.calls, tris: renderer.info.render.triangles, pr: pixelRatio };
  },
  finish: () => showEnd(),
  cards: () => { S.pendingCards++; openCards(); },
  card: (i) => document.querySelectorAll('.card')[i]?.click(),
};
</script>
</body>
